# Production docker-compose for SENS.
# - Caddy terminates TLS for both vhosts (auto Let's Encrypt).
# - DB is internal-only (no port published to the host).
# - All long-running services log with rotation so a runaway log doesn't
#   fill the VPS disk.
#
# Bring it up with:
#   cp .env.example .env  &&  fill secrets  &&  docker compose up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 5s
      timeout: 3s
      retries: 5

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337

      # Reverse-proxy awareness: Strapi will trust X-Forwarded-* and emit
      # absolute URLs against PUBLIC_URL instead of http://localhost:1337.
      PUBLIC_URL: https://${STRAPI_DOMAIN}
      IS_PROXIED: "true"

      # CORS: only the public frontend may call the API.
      CORS_ORIGIN: https://${SITE_DOMAIN}

      # Preview redirects (admin → frontend draft view).
      CLIENT_URL: https://${SITE_DOMAIN}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET must be set in .env}

      # Used by the frontend-aware bootstrap migrations.
      FRONTEND_URL: https://${SITE_DOMAIN}

      # Database
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DATABASE_SSL: "false"

      # Strapi secrets — generate each with `openssl rand -base64 32`.
      APP_KEYS: ${APP_KEYS:?APP_KEYS must be set in .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT must be set in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET must be set in .env}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
    volumes:
      - strapi_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:1337/_health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite freezes these into the client bundle at BUILD time, so they
        # must reflect the public URLs the browser will use.
        VITE_STRAPI_URL: https://${STRAPI_DOMAIN}
        VITE_SITE_URL: https://${SITE_DOMAIN}
        VITE_GTM_ID: ${VITE_GTM_ID:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ORIGIN: https://${SITE_DOMAIN}
      # Server-side fetches go over the internal Docker network — fast and
      # never leaves the host.
      STRAPI_URL_INTERNAL: http://strapi:1337
      VITE_SITE_URL: https://${SITE_DOMAIN}
      # Allow larger admin uploads to round-trip through the SSR layer.
      BODY_SIZE_LIMIT: "10485760"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
      strapi:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      STRAPI_DOMAIN: ${STRAPI_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env (Let's Encrypt notifications)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional: enable with `docker compose --profile monitoring up -d`.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    logging: *default-logging
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3001:3001"   # bind to loopback; access via SSH tunnel
    volumes:
      - uptime_kuma:/app/data

volumes:
  pgdata:
  strapi_uploads:
  caddy_data:
  caddy_config:
  uptime_kuma:
